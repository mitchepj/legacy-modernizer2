[package]
name = "legacy-modernizer"
version = "0.1.0"
edition = "2021"
description = "Six-agent legacy code modernization orchestrator (Discovery, Risk & Triage, Architecture & Decoupling, Code Generation, Verification, Documentation & Audit), built for air-gapped deployment against a self-hosted, OpenAI-compatible LLM endpoint."
license = "Apache-2.0"
repository = "https://github.com/REPLACE_ME/legacy-modernizer"

[[bin]]
name = "legacy-modernizer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
